services:
  vllm:
    image: ghcr.io/opengfx1030/vllm-rdna:v0.34.0-1-rocm7.14.0
    container_name: vllm
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    environment:
      # entrypoint
      VLLM_API_KEY_NAMES: ${VLLM_API_KEY_NAMES:?Set VLLM_API_KEY_NAMES in .env}
      # runtime identity & cache paths
      HOME: /state
      # UID 1000 has no passwd entry in the image; PyTorch needs a username.
      USER: vllm
      XDG_CACHE_HOME: /state/cache
      HF_HOME: /state/huggingface
      HF_HUB_OFFLINE: 1
      VLLM_CACHE_ROOT: /state/vllm
      TORCHINDUCTOR_CACHE_DIR: /state/torch
      TRITON_CACHE_DIR: /state/triton
      # rdna2 runtime compatibility
      VLLM_ROCM_USE_AITER: 0
      VLLM_ROCM_USE_AITER_MOE: 0
      VLLM_GDN_HIP_PREFILL: 1
      VLLM_DISABLED_KERNELS: ExllamaLinearKernel
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_USE_RDNA2_FA: 1
      VLLM_RDNA_FORCE_FP16: 1
      VLLM_RDNA_AR: 0
      VLLM_USE_V2_MODEL_RUNNER: 1
      GPU_MAX_HW_QUEUES: 2
      TORCH_BLAS_PREFER_HIPBLASLT: 0
      PYTORCH_TUNABLEOP_ENABLED: 0
      PYTORCH_TUNABLEOP_HIPBLASLT_ENABLED: 0
      NCCL_P2P_DISABLE: 1
    env_file:
      - .env
      - .secrets
    shm_size: 4gb
    ports:
      - ${INFERENCE_BIND_ADDRESS:?Set INFERENCE_BIND_ADDRESS to the guest LAN IP}:8000:8000/tcp
    # Use both attached V620s for tensor-parallel ranks.
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ./data/:/state/:rw
      - ./entrypoint.sh:/usr/local/bin/vllm-entrypoint:ro
      - /models/safetensors/:/models/local/:rw
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vllm-entrypoint
    command:
      - serve
      - /models/local/${VLLM_MODEL_DIR:?Set VLLM_MODEL_DIR to a Hugging Face checkpoint}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-vllm}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      - --quantization
      - gptq
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${CONTEXT_SIZE:-262144}
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":1}'
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-5}
      - --enable-prefix-caching
      - --mamba-cache-dtype
      - float32
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.3}
      - --kv-cache-dtype
      - float16
      - --limit-mm-per-prompt
      - '{"image":2,"video":0}'
      - --skip-mm-profiling
      - --disable-custom-all-reduce
      - --default-chat-template-kwargs
      - '{"enable_thinking":true}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - vllm-net

networks:
  vllm-net:
    name: vllm-net
