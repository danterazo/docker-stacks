# Standalone, opt-in stack. Do not merge this with compose.yaml.
name: radeon-flash-next
services:
  flash-next:
    profiles: [experiment]
    image: blivioniag/vllm-rdna:v0.31.0-extras@sha256:16cbf6a09c879b2c69012c60bed4eb935e3029839bc641d1a9574931e8b9f127
    init: true
    restart: 'no'
    user: '1000:1000'
    group_add: ['${VIDEO_GID:-44}', '${RENDER_GID:-991}']
    devices: [/dev/kfd, /dev/dri]
    shm_size: 4gb
    ports: ['127.0.0.1:${FLASH_NEXT_PORT:-8001}:8000']
    environment:
      HOME: /tmp
      USER: vllm
      FLASH_NEXT_CONTEXT: '${FLASH_NEXT_CONTEXT:-32768}'
      FLASH_NEXT_KV_BYTES: '${FLASH_NEXT_KV_BYTES:-4026531840}'
      FLASH_NEXT_REASONING_PARSER: '${FLASH_NEXT_REASONING_PARSER:-qwen3}'
    volumes:
      - type: bind
        source: ${FLASH_NEXT_MODEL:-/models/safetensors/wtdcode/Qwen3.8-Flash-Next-AWQ-W4A16}
        target: /model
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FLASH_NEXT_PLE:-/models/safetensors/primitive-ai/Qwen3.8-Flash-Next-PLE-quant/ples_int4}
        target: /ples_int4
        read_only: true
        bind: {create_host_path: false}
      - ./flash-next-launch.sh:/experiment/launch.sh:ro
      - ./data:/state
    entrypoint: [bash, /experiment/launch.sh]
    command: ['--serve']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
