services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: 1000
      PGID: 1000
    env_file:
      - .env
      - .secrets
    volumes:
      - ./state/:/config/:rw
      - ./config/:/config/qBittorrent/:rw
      - ./ui/:/ui/:rw
      - ./modcache/:/modcache/:rw
      - /mnt/downloads/:/downloads/:rw # LXC bind mount of tank/downloads/qbittorrent
    network_mode: service:gluetun # use VPN
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'curl -s http://localhost:8090/api/v2/transfer/info | jq -e ''.connection_status == "connected"'' > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    environment:
      PUID: 1000
      PGID: 1000
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    ports:
      - 192.168.30.116:8090:8090/tcp # qbittorrent web UI
    env_file:
      - .env
      - .secrets
    volumes:
      - ./gluetun/:/gluetun/:rw
    networks:
      - gluetun-net
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m

networks:
  gluetun-net:
    name: gluetun-net
    enable_ipv6: true

x-dockge:
  urls:
    - https://qb.samskeyti.net/
