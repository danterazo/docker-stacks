services:
  ollama:
    image: ollama/ollama:rocm
    container_name: radeon-ollama
    profiles: [ollama]
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - ${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434/tcp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ./data/ollama/:/state/:rw
      - /tank/models/ollama/:/models/:rw
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - radeon-vm-net

  vllm:
    image: blivioniag/vllm-rdna:v0.31.0-extras
    container_name: radeon-vllm
    profiles: [vllm]
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    env_file: .env
    shm_size: 4gb
    ports:
      - ${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8000}:8000/tcp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ./data/vllm/:/state/:rw
      - /tank/models/${VLLM_MODEL_DIR:?Set VLLM_MODEL_DIR to a local Hugging Face checkpoint}/:/model/:ro
    command:
      - serve
      - /model
      - --served-model-name
      - radeon-vllm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-4}
      - --max-model-len
      - ${CONTEXT_SIZE:-8192}
      - --max-num-seqs
      - "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - radeon-vm-net

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: radeon-inference
    profiles: [gpu]
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - ${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_PORT:-8080}:8080/tcp
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tank/models/:/models/:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/${MODEL_FILE:?Set MODEL_FILE to a GGUF path relative to /tank/models}
      - --alias
      - radeon
      - --n-gpu-layers
      - "99"
      - --split-mode
      - layer
      - --ctx-size
      - ${CONTEXT_SIZE:-8192}
      - --parallel
      - "1"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m
    networks:
      - radeon-vm-net

networks:
  radeon-vm-net:
    name: radeon-vm-net
