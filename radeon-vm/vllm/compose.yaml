services:
  vllm:
    image: blivioniag/vllm-rdna:v0.31.0-extras
    container_name: radeon-vllm
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    env_file: .env
    shm_size: 4gb
    ports:
      - ${INFERENCE_BIND_ADDRESS:?Set INFERENCE_BIND_ADDRESS to the guest LAN IP}:${VLLM_PORT:-8000}:8000/tcp
    # Match tensor parallelism to the attached and validated V620 count.
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ./data/:/state/:rw
      # Fail instead of creating an empty directory on the VM root filesystem.
      - type: bind
        source: /models/vllm
        target: /models/local
        bind:
          create_host_path: false
      - tank-models:/models/nas/:rw
    command:
      - serve
      - /models/${VLLM_MODEL_SOURCE:-local}/${VLLM_MODEL_DIR:?Set VLLM_MODEL_DIR to a Hugging Face checkpoint}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-radeon-vllm}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${CONTEXT_SIZE:-8192}
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.3}
      - --kv-cache-dtype
      - float16
      # Conservative PCIe fallback until GPU P2P is tested.
      - --disable-custom-all-reduce
      - --language-model-only
      - --skip-mm-profiling
      # The chat template starts thinking in the prompt; split generated reasoning.
      - --reasoning-parser
      - qwen3
      # The current Qwen checkpoint emits Qwen3-Coder-style XML tool calls.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-qwen3_xml}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - vllm-net

networks:
  vllm-net:
    name: vllm-net

volumes:
  tank-models:
    driver: local
    driver_opts:
      type: nfs
      device: :/tank/models
      o: addr=192.168.20.42,hard,rw,noatime,nfsvers=4.2,nconnect=8
