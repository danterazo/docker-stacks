services:
  vllm:
    image: blivioniag/vllm-rdna:v0.31.0-extras
    container_name: radeon-vllm
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    env_file: .env
    shm_size: 4gb
    ports:
      - ${INFERENCE_BIND_ADDRESS:?Set INFERENCE_BIND_ADDRESS to the guest LAN IP}:${VLLM_PORT:-8000}:8000/tcp
    # Match tensor parallelism to the attached and validated V620 count.
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ./data/:/state/:rw
      # Use the already-mounted NAS; do not silently create an empty path.
      - type: bind
        source: /tank/models/${VLLM_MODEL_DIR:?Set VLLM_MODEL_DIR to a local Hugging Face checkpoint}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    command:
      - serve
      - /model
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-radeon-vllm}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${CONTEXT_SIZE:-8192}
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.3}
      - --kv-cache-dtype
      - float16
      # Conservative PCIe fallback until GPU P2P is tested.
      - --disable-custom-all-reduce
      - --language-model-only
      - --skip-mm-profiling
      # The current Qwen checkpoint emits Qwen3-Coder-style XML tool calls.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-qwen3_xml}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - vllm-net

networks:
  vllm-net:
    name: vllm-net
