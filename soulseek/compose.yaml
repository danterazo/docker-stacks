services:
  soulseek:
    image: slskd/slskd:latest
    container_name: soulseek
    env_file:
      - .env
      - .secrets
    volumes:
      - ./db/:/app/data/:rw
      - ./logs/:/app/logs/:rw
      - ./slskd.yml:/app/slskd.yml:rw
      - /mnt/downloads/:/app/:rw # LXC bind mount of tank/downloads/soulseek
    restart: unless-stopped
    network_mode: service:gluetun # use VPN
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    environment:
      PUID: 1000
      PGID: 1000
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    ports:
      - 192.168.30.117:5030:5030/tcp # soulseek web UI
    env_file:
      - .env
      - .secrets
    volumes:
      - ./gluetun/:/gluetun/:rw
    networks:
      - gluetun-net
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m

networks:
  gluetun-net:
    name: gluetun-net
    enable_ipv6: true

x-dockge:
  urls:
    - https://soulseek.samskeyti.net/
