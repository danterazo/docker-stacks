services:
  ollama:
    image: ollama/ollama:rocm
    container_name: radeon-ollama
    user: 1000:1000
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-991}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - 11434:11434/tcp
    volumes:
      - ./data/:/state/:rw
      - models_nfs:/models/:rw,nocopy
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ollama-net

networks:
  ollama-net:
    name: ollama-net

volumes:
  models_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.20.42,nfsvers=4.2,nconnect=8,rw,hard,noatime
      device: :/tank/models/ollama
