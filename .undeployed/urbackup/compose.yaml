# TODO: Migrate from bare metal LXC -> Docker LXC
services:
  urbackup:
    image: uroni/urbackup-server:latest
    container_name: urbackup
    environment:
      PUID: 1000
      PGID: 1000
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./db/:/var/urbackup/:rw
      - ./www/:/usr/share/urbackup/:rw
      - ./clients/:/backups/clients/:rw
      - ./appdata/:/backups/urbackup/:rw
      #- /self-hosted/urbackup/temp/:/backups/urbackup_tmp_files/:rw
      - /mnt/mega-pool/app-data/urbackup/:/backups/:rw
    network_mode: host # TODO: do I really need host mode?
    # Uncomment the following two lines if you're using BTRFS support
    #cap_add:
    #  - SYS_ADMIN
    # Uncomment the following two lines if you're using ZFS support
    #devices:
    #  - /dev/zfs:/dev/zfs

x-dockge:
  urls:
    - https://backup.samskeyti.net/
