services:
  dockge-master-app:
    container_name: dockge-master
    image: louislam/dockge:latest
    restart: unless-stopped
    cpus: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data/:/app/data/:rw
      - /apps/:/apps/:rw
    env_file: .env
    environment:
      DOCKGE_STACKS_DIR: /apps
    networks:
      - dockge-master-net
    extra_hosts:
      - immich.lxc:192.168.30.104
      - networking.vm:192.168.30.100

  dockge-oauth:
    container_name: dockge-master-oauth
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: --config /oauth2-proxy.cfg
    restart: always
    ports:
      - 5002:5002/tcp
    env_file: .env
    volumes:
      - ./oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    networks:
      - dockge-master-net
    depends_on:
      - dockge-master-app

networks:
  dockge-master-net:
    name: dockge-master-net

x-dockge:
  urls:
    - https://stacks.samskeyti.net/
