services:
  strava-stats:
    image: robiningelbrecht/strava-statistics:latest
    container_name: strava-stats
    volumes:
      - ./build/:/var/www/build/:rw
      - ./db/:/var/www/storage/database:rw
      - ./files/:/var/www/storage/files:rw # HTML, logs, etc.
      - /self-hosted/strava-stats/.env:/var/www/.env:ro
    env_file: .env
    # expose:
    #   - 8080
    ports:
      - 8070:8080/tcp
    #user: ${PUID}:${PGID}
    restart: unless-stopped
    networks:
      - proxy-net

networks:
  strava-net:
    name: strava-net

  proxy-net:
    external: true

x-dockge:
  urls:
    - https://bike.samskeyti.net/
