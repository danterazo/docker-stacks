# TODO: add oauth2
services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre
    environment:
      PUID: 1000
      PGID: 1000
    env_file: .env
    volumes:
      - ./config/:/config/:rw
      - /mnt/mega-pool/media/books/calibre/:/library/:rw
    # expose:
    #   - 8083
    ports:
      - 8083:8083/tcp
    restart: unless-stopped
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true

x-dockge:
  urls:
    - https://books.samskeyti.net/
