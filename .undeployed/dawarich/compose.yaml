services:
  dawarich-app:
    image: freikin/dawarich:${IMAGE_VERSION}
    container_name: dawarich-app
    volumes:
      - ./public/:/var/app/public/:rw
      - ./storage/:/var/app/storage/:rw
      - /self-hosted/dawarich/app/imports/:/var/app/tmp/imports/:rw
    networks:
      - dawarich-net
      - proxy-net
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: [bin/rails, server, -p, "3000", -b, "::"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      dawarich-db:
        condition: service_healthy
        restart: true
      dawarich-redis:
        condition: service_healthy
        restart: true
      dawarich-geo:
        condition: service_started
        restart: true
    healthcheck:
      test: [CMD-SHELL, "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s

  dawarich-redis:
    image: redis:7.4-alpine
    container_name: dawarich-redis
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    networks:
      - dawarich-net
    volumes:
      - ./redis-data/:/data/:rw
      - ./redis/:/var/shared/redis/:rw
      - ./shared-db/:/var/shared/:rw
    restart: always
    healthcheck:
      test: [CMD, redis-cli, --raw, incr, ping]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich-db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich-db
    shm_size: 1G
    volumes:
      - ./postgres/:/var/lib/postgresql/data/:rw
      - ./shared-db/:/var/shared/:rw
      - /self-hosted/dawarich/db-dumps/:/dumps:rw
    networks:
      - dawarich-net
    env_file: .env
    restart: always
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d dawarich_development]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich-geo:
    image: rtuszik/photon-docker:latest
    container_name: dawarich-geo
    expose:
      - 2322
    env_file: .env
    environment:
      INITIAL_DOWNLOAD: "FALSE"
      UPDATE_STRATEGY: DISABLED
      FORCE_UPDATE: "FALSE"
    volumes:
      - ./photon/:/photon/:rw
      - /self-hosted/dawarich/photon-db/:/photon/data/photon_data/:rw
    restart: always
    networks:
      - dawarich-net

  dawarich-sidekiq:
    image: freikin/dawarich:${IMAGE_VERSION}
    container_name: dawarich-sidekiq
    volumes:
      - ./public/:/var/app/public/:rw
      - ./storage/:/var/app/storage/:rw
      - /self-hosted/dawarich/app/imports/:/var/app/tmp/imports/:rw
    networks:
      - dawarich-net
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: [bundle, exec, sidekiq]
    restart: on-failure
    env_file: .env
    depends_on:
      dawarich-db:
        condition: service_healthy
        restart: true
      dawarich-redis:
        condition: service_healthy
        restart: true
      dawarich-app:
        condition: service_healthy
        restart: true
      dawarich-geo:
        condition: service_started
        restart: true
    healthcheck:
      test: [CMD-SHELL, "bundle exec sidekiqmon processes | grep $${HOSTNAME}"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s

  dawarich-oauth:
    container_name: dawarich-oauth
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: --config /oauth2-proxy.cfg
    restart: always
    ports:
      - 3002:3002/tcp
    env_file: .env
    volumes:
      - /self-hosted/dawarich/oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    networks:
      - proxy-net
      - dawarich-net
    depends_on:
      dawarich-app:
        condition: service_healthy
        restart: true

networks:
  dawarich-net:
    name: dawarich-net

  proxy-net:
    external: true
  #  immich-net:
  #    external: true

x-dockge:
  urls:
    - https://track.samskeyti.net/

