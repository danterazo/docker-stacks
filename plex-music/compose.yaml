services:
  plex-music:
    container_name: plex-music
    image: plexinc/pms-docker:latest
    restart: always
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - ./data/plex/:/config/:rw
      - /mnt/backups/:/backups/:rw # LXC bind mount of tank/backups/apps/plex-music
      - /mnt/music/:/media/music/:rw # LXC bind mount of tank/media/music
      - /mnt/audiobooks/:/media/audiobooks/:rw # LXC bind mount of tank/media/audiobooks
      - /dev/shm/plex-transcode/:/transcode/:rw
    networks:
      - plex-music-net

  # TODO: add oauth2
  tautulli-music:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: 1000
      PGID: 1000
    cpus: 1
    env_file: .env
    volumes:
      - ./data/plex/:/plex-data/:ro
      - ./data/tautulli/:/config/:rw
    ports:
      - 8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-music
    networks:
      - plex-music-net

networks:
  plex-music-net:
    name: plex-music-net

x-dockge:
  urls:
    - https://plexm.samskeyti.net/
