services:
  plex-music:
    container_name: plex-music
    image: plexinc/pms-docker:latest
    restart: always
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - ./data/plex/:/config/:rw
      - backups_nfs:/backups/:rw
      - music_nfs:/media/music/:rw
      - audiobooks_nfs:/media/audiobooks/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    networks:
      - plex-music-net

  # TODO: add oauth2
  tautulli-music:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: 1000
      PGID: 1000
    cpus: 1
    env_file: .env
    volumes:
      - ./data/plex/:/plex-data/:ro
      - ./data/tautulli/:/config/:rw
    ports:
      - 8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-music
    networks:
      - plex-music-net

networks:
  plex-music-net:
    name: plex-music-net

volumes:
  music_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.20.42,rw,noatime,nfsvers=4,soft
      device: ":/tank/media/music/"

  audiobooks_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.20.42,rw,noatime,nfsvers=4,soft
      device: ":/tank/media/audiobooks/"

  backups_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.20.42,rw,noatime,nfsvers=4,hard
      device: ":/tank/backups/apps/plex-music/"

x-dockge:
  urls:
    - https://plexm.samskeyti.net/
