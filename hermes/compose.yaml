services:
  hermes:
    container_name: hermes
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    env_file:
      - .secrets
      - .env
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    ports:
      - 192.168.30.130:8642:8642/tcp
      - 192.168.30.130:9119:9119/tcp
    volumes:
      - ./data/:/opt/data/:rw
      - /mnt/shared-ai/instructions.md:/opt/data/shared-ai/instructions.md:rw
      - /mnt/shared-ai/preferences.md:/opt/data/shared-ai/preferences.md:rw
      - /mnt/shared-ai/debugging.md:/opt/data/shared-ai/debugging.md:rw
      - /mnt/shared-ai/skills/:/opt/data/shared-ai/skills/:rw
    networks:
      - hermes-net
    command: [gateway, run]

networks:
  hermes-net:
    name: hermes-net

x-dockge:
  urls:
    - https://hermes.samskeyti.net/
