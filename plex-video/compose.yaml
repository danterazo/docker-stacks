services:
  plex-video:
    container_name: plex-video
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - ./data/plex/:/config/:rw
      - /tank/backups/apps/plex-video/:/backups/:rw
      - /tank/media/videos/:/media/videos/:rw
    tmpfs:
      - /transcode:rw,size=1g,uid=1000,gid=1000,mode=0755
    networks:
      - plex-video-net

  # TODO: add oauth2
  tautulli-video:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: 1000
      PGID: 1000
    env_file: .env
    volumes:
      - ./data/plex/:/plex-data/:ro
      - ./data/tautulli/:/config/:rw
    ports:
      - ${LAN_BIND_ADDRESS:-192.168.30.108}:8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-video
    networks:
      - plex-video-net

networks:
  plex-video-net:
    name: plex-video-net

x-dockge:
  urls:
    - https://plexv.samskeyti.net/
