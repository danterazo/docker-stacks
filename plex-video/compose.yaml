services:
  plex-video:
    container_name: plex-video
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - ./data/plex/:/config/:rw
      - backups_virtiofs:/backups/:rw
      - videos_virtiofs:/media/videos/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    networks:
      - plex-video-net

  # TODO: add oauth2
  tautulli-video:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: 1000
      PGID: 1000
    cpus: 1
    env_file: .env
    volumes:
      - ./data/plex/:/plex-data/:ro
      - ./data/tautulli/:/config/:rw
    ports:
      - 8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-video
    networks:
      - plex-video-net

networks:
  plex-video-net:
    name: plex-video-net

volumes:
  videos_virtiofs: # Proxmox dir mapping plex-videos -> /tank/media/videos (VM 101 virtiofs4)
    driver: local
    driver_opts:
      type: virtiofs
      device: plex-videos

  backups_virtiofs: # plex-video-backups -> /tank/backups/apps/plex-video (virtiofs5)
    driver: local
    driver_opts:
      type: virtiofs
      device: plex-video-backups

x-dockge:
  urls:
    - https://plexv.samskeyti.net/
