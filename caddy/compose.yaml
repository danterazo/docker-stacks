services:
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy:local
    ports:
      - 80:80/tcp # HTTP
      - 443:443/tcp # HTTPS
      - 443:443/udp # HTTP/3
      - 8080:8080/tcp
    env_file:
      - .env
      - .secrets
    networks:
      - caddy-net
    restart: always
    volumes:
      - ./data/:/data/caddy/:rw
      - ./configs/:/etc/caddy/:rw

  tailscale:
    image: tailscale/tailscale:latest
    init: true
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
      - tailscale.env
    volumes:
      - /var/lib/tailscale/:/var/lib/tailscale/:rw
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro
      - ./keepalived/check-caddy.sh:/etc/tailscale/check-service.sh:ro
      - ../_common/bin/tailscale-service-healthcheck.sh:/usr/local/bin/tailscale-service-healthcheck.sh:ro
    healthcheck:
      test: [CMD, /bin/sh, /usr/local/bin/tailscale-service-healthcheck.sh]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 10m

  keepalived:
    image: osixia/keepalived:latest
    container_name: keepalived
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    env_file:
      - .env
      - keepalived.env
    environment:
      KEEPALIVED_CONF_TEMPLATE: /etc/keepalived/keepalived.conf.template
    volumes:
      - ./keepalived/keepalived.conf.template:/etc/keepalived/keepalived.conf.template:ro
      - ./keepalived/check-caddy.sh:/etc/keepalived/check-caddy.sh:ro

networks:
  caddy-net:
    name: caddy-net
