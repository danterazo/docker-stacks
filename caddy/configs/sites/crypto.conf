qaxe.samskeyti.net {
	import common
	reverse_proxy http://172.16.10.167:80 {
		header_up Origin ^https://qaxe[.]samskeyti[.]net$ http://172.16.10.167
	}
}

gamma1.samskeyti.net {
	import common
	reverse_proxy http://172.16.0.249:80
}

gamma2.samskeyti.net {
	import common
	reverse_proxy http://172.16.0.185:80
}

antminer1.samskeyti.net, https://antminer1.samskeyti.net:8080 {
	import common
	map {http.request.local.port} {antminer1_upstream_port} {
		8080 "8080"
		default "80"
	}
	reverse_proxy 192.168.60.10:{antminer1_upstream_port}
}

antminer2.samskeyti.net, https://antminer2.samskeyti.net:8080 {
	import common
	map {http.request.local.port} {antminer2_upstream_port} {
		8080 "8080"
		default "80"
	}
	reverse_proxy 192.168.60.20:{antminer2_upstream_port}
}
