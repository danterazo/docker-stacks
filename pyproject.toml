[project]
    name = "docker"
    version = "0.1.0"
    description = "Homelab Containers"
    authors = [{name = "Dante Razo", email = "github.d2brf@simplelogin.fr"}]
    readme = "README.md"
    requires-python = ">=3.15.2"
    dependencies = ["ruff"]

[tool.ruff]
    line-length = 150
    exclude = [".git", ".venv"]

[tool.ruff.lint.per-file-ignores]
"scripts/lint-compose-spacing.py" = ["UP045"]
