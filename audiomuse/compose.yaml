services:
  postgres:
    # image: postgres:15-alpine
    image: postgres:15
    container_name: audiomuse-postgres
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiomuse-net

  # AudioMuse-AI Flask application service
  flask:
    image: ghcr.io/neptunehub/audiomuse-ai:latest-nvidia
    container_name: audiomuse-flask
    environment:
      SERVICE_TYPE: flask
    ports:
      - 8000:8000/tcp
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/flask-plugins/:/app/plugin/installed/:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

  # AudioMuse-AI Queue Worker service
  audiomuse-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:latest-nvidia
    container_name: audiomuse-worker
    environment:
      SERVICE_TYPE: worker
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/worker-plugins/:/app/plugin/installed/:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

networks:
  audiomuse-net:
    name: audiomuse-net
