services:
  postgres:
    image: postgres:15
    container_name: audiomuse-postgres
    ports:
      - 192.168.30.121:5432:5432/tcp
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiomuse-net

  flask:
    image: ghcr.io/neptunehub/audiomuse-ai:latest-nvidia
    container_name: audiomuse-flask
    environment:
      SERVICE_TYPE: flask
    ports:
      - 192.168.30.121:8000:8000/tcp
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/flask-plugins/:/app/plugin/installed/:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

  audiomuse-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:latest-nvidia
    container_name: audiomuse-worker
    hostname: kex-worker
    environment:
      SERVICE_TYPE: worker
    env_file:
      - .env
      - .secrets
    volumes:
      - ./data/worker-plugins/:/app/plugin/installed/:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

  audiomuse-worker-2:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-2
    hostname: kex-worker-2
    volumes:
      - ./data/worker-2-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-3:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-3
    hostname: kex-worker-3
    volumes:
      - ./data/worker-3-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-4:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-4
    hostname: kex-worker-4
    volumes:
      - ./data/worker-4-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-5:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-5
    hostname: kex-worker-5
    volumes:
      - ./data/worker-5-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-6:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-6
    hostname: kex-worker-6
    volumes:
      - ./data/worker-6-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-7:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-7
    hostname: kex-worker-7
    volumes:
      - ./data/worker-7-plugins/:/app/plugin/installed/:rw

  audiomuse-worker-8:
    extends:
      service: audiomuse-worker
    container_name: audiomuse-worker-8
    hostname: kex-worker-8
    volumes:
