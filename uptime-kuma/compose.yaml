services:
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    user: 1000:1000
    restart: unless-stopped
    ports:
      - 3001:3001/tcp
    env_file: .env
    volumes:
      - ./data/:/app/data/:rw
    networks:
      - kuma-net

  mining-records:
    container_name: mining-records
    image: louislam/uptime-kuma:2
    user: 1000:1000
    restart: unless-stopped
    entrypoint: [node, /opt/luxos/best-difficulty.mjs]
    command: []
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    depends_on:
      uptime-kuma:
        condition: service_healthy
    env_file:
      - .env
      - .secrets
    volumes:
      - ./scripts/luxos/best-difficulty.mjs:/opt/luxos/best-difficulty.mjs:ro
      - ./scripts/luxos/miners.json:/opt/luxos/miners.json:ro
      - ./best-difficulty-data/:/records/:rw
    networks:
      - kuma-net

networks:
  kuma-net:
    name: kuma-net
