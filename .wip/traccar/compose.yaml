# TODO: Migrate to Docker LXC
services:
  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    restart: unless-stopped
    env_file: .env
    #    expose:
    #      - 8082
    #      - 5002
    ports:
      - 8082:8082/tcp # UI
      - 5002:5002/tcp # service
      - 5002:5002/udp # service
    volumes:
      - ./logs/:/opt/traccar/logs/:rw
      - ./data/:/opt/traccar/data/:rw
      - /self-hosted/traccar/config/:/opt/traccar/conf/:rw
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true

x-dockge:
  urls:
    - https://traccar.samskeyti.net/
