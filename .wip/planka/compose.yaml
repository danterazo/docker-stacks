services:
  planka-app:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka-app
    restart: always
    volumes:
      - ./avatars/:/app/public/user-avatars/:rw
      - ./backgrounds/:/app/public/project-background-images/:rw
      - ./attachments/:/app/private/attachments/:rw
    env_file: .env
    depends_on:
      planka-db:
        condition: service_healthy
    networks:
      - planka-net

  planka-db:
    image: postgres:16-alpine
    container_name: planka-db
    restart: always
    env_file: .env
    volumes:
      - ./db/:/var/lib/postgresql/data/:rw
    #user: ${PUID}:${PGID}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d planka]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planka-net

  planka-oauth:
    container_name: planka-oauth
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: --config /oauth2-proxy.cfg
    restart: always
    # expose:
    #   - ${PLANKA_PORT}
    ports:
      - ${PLANKA_PORT}:${PLANKA_PORT}/tcp
    env_file: .env
    volumes:
      - /self-hosted/planka/oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    networks:
      - planka-net
      - proxy-net
    depends_on:
      - planka-app

networks:
  planka-net:
    name: planka-net

  proxy-net:
    external: true

x-dockge:
  urls:
    - https://planka.samskeyti.net/
