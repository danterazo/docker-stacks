services:
  hivenet:
    container_name: hivenet
    hostname: kex-vm
    image: hivecomputing/hive-disk:latest
    restart: always
    ports:
      - 8080:8080/tcp # web UI
      - 8082:8082/tcp # metrics
      - 4001:4001/tcp # data plane
      - 4001:4001/udp # data plane
      - 4443:4443/tcp # control plane
      - 4443:4443/udp # control plane
    env_file: .env
    cpus: 2
    #command: hive-agent contribute 6000 # 6TB contribution
    command: hive-agent daemon
    networks:
      - hive-disk-net
    volumes:
      - ./machine-config/machine-id:/etc/machine-id:ro
      - hivenet_nfs:/home/hive/.hive/:rw

networks:
  hive-disk-net:
    name: hive-disk-net

volumes:
  hivenet_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.20.42,hard,rw,noatime,nfsvers=4.2,nconnect=8
      device: ":/tank/ephemeral/hivenet-contributions/"
