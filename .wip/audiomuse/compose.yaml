services:
  postgres:
    # image: postgres:15-alpine
    image: postgres:15
    container_name: audiomuse-postgres
    env_file:
      - .env
      - .secrets
    ports:
      - 5432:5432/tcp
    volumes:
      - ./db/:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - audiomuse-net

  # AudioMuse-AI Flask application service
  flask:
    image: ghcr.io/neptunehub/audiomuse-ai:pr-846-nvidia
    container_name: audiomuse-flask
    ports:
      - 8000:8000/tcp
    env_file:
      - .env
      - .secrets
    environment:
      SERVICE_TYPE: worker
    volumes:
      - ./flask-plugins/:/app/plugin/installed/:rw
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

  # AudioMuse-AI Queue Worker service
  audiomuse-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:pr-846-nvidia
    container_name: audiomuse-worker
    env_file:
      - .env
      - .secrets
    volumes:
      - ./worker-plugins/:/app/plugin/installed/:rw
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu

networks:
  audiomuse-net:
    name: audiomuse-net
