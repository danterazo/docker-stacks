services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: always
    env_file: common.env # common for all instances
    volumes:
      - ./state/:/opt/adguardhome/work/:rw
      - ./configs/:/opt/adguardhome/conf/:rw
    network_mode: host

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    entrypoint: [/bin/sh, /etc/tailscale/entrypoint.sh]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - common.env
      - tailscale.env
    volumes:
      - type: bind
        source: /var/lib/tailscale/
        target: /var/lib/tailscale/
        bind:
          create_host_path: false
      - ./tailscale/entrypoint.sh:/etc/tailscale/entrypoint.sh:ro
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro
      - ./keepalived/check-dns.sh:/etc/tailscale/check-service.sh:ro
      - ../_common/bin/tailscale-service-healthcheck.sh:/usr/local/bin/tailscale-service-healthcheck.sh:ro
    healthcheck:
      test: [CMD, /bin/sh, /usr/local/bin/tailscale-service-healthcheck.sh]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 10m

  keepalived:
    image: osixia/keepalived:latest
    container_name: keepalived
    profiles:
      - failover
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    env_file:
      - common.env
      - keepalived.env
    volumes:
      - ./keepalived/keepalived.conf.template:/etc/keepalived/keepalived.conf.template:ro
      - ./keepalived/check-dns.sh:/etc/keepalived/check-dns.sh:ro

  # only runs in one LXC
  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguardhome-sync
    restart: unless-stopped
    command: run
    profiles:
      - sync
    ports:
      - 8070:8080/tcp
    env_file: common.env
