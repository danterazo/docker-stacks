services:
  pocket-id:
    container_name: pocket-id
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: always
    cpus: 1
    env_file:
      - .env
      - .secrets
    ports:
      - 192.168.30.100:1411:1411/tcp
    volumes:
      - ./data/:/app/data/:rw
    healthcheck:
      test: [CMD, /app/pocket-id, healthcheck]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - pocket-id-net

networks:
  pocket-id-net:
    name: pocket-id-net

x-dockge:
  urls:
    - https://id.samskeyti.net/
