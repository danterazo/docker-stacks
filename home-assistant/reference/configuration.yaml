default_config:

adaptive_lighting:
  - name: Living Room
    lights:
      - light.living_room_left_lamp
      - light.living_room_right_lamp
    interval: 90
    transition: 45
    take_over_control: true
    adapt_only_on_bare_turn_on: true
    manual_control_on_external_turn_on: true
    detect_non_ha_changes: false
  - name: Hallway
    lights:
      - light.hallway_inner_light
      - light.hallway_outer_light
    interval: 90
    transition: 45
    take_over_control: true
    adapt_only_on_bare_turn_on: true
    manual_control_on_external_turn_on: true
    detect_non_ha_changes: false

template:
  - sensor:
      - name: Server Rack Total Power
        unique_id: server_rack_total_power
        state: >
          {% set values = [
            'sensor.server_rack_kex_power',
            'sensor.server_rack_kveikur_power',
            'sensor.server_rack_ovedur_power',
            'sensor.server_rack_xfinity_xb10_power'
          ]
            | map('states')
            | map('float', 0)
            | list %}
          {{ values | sum | round(3) }}
        availability: >
          {{ [
            'sensor.server_rack_kex_power',
            'sensor.server_rack_kveikur_power',
            'sensor.server_rack_ovedur_power',
            'sensor.server_rack_xfinity_xb10_power'
          ]
            | select('has_value')
            | list
            | count > 0 }}
        attributes:
          member_entities: >
            {{ [
              'sensor.server_rack_kex_power',
              'sensor.server_rack_kveikur_power',
              'sensor.server_rack_ovedur_power',
              'sensor.server_rack_xfinity_xb10_power'
            ] }}
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        icon: mdi:server-network
