services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    environment:
      PUID: 1000
      PGID: 1000
    restart: unless-stopped
    ports:
      - 192.168.30.104:7912:8000/tcp
    env_file: .env
    volumes:
      - ./data/:/home/app/.local/share/spoolman:rw
    networks:
      - spoolman-net

networks:
  spoolman-net:
    name: spoolman-net
